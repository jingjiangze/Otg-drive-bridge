name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------ signed apk
  # T8: the signed release APK. The keystore never enters the repository —
  # app/build.gradle.kts reads KEYSTORE_PATH/KEYSTORE_PASS/KEY_ALIAS/KEY_PASS
  # from the environment, and the bytes live in OTG_KEYSTORE_B64.
  apk:
    name: Signed release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject openp2p AAR
        uses: ./.github/actions/inject-openp2p-aar

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: bash tools/ci-android-sdk.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Materialise keystore
        env:
          KEYSTORE_B64: ${{ secrets.OTG_KEYSTORE_B64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Assemble release APK
        env:
          KEYSTORE_PASS: ${{ secrets.OTG_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.OTG_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.OTG_KEY_PASS }}
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Verify signature
        run: |
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Stage asset
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "otg-drive-bridge-$VERSION.apk"
          sha256sum "otg-drive-bridge-$VERSION.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: otg-release-apk
          path: otg-drive-bridge-*.apk
          if-no-files-found: error

  # ------------------------------------------------------------- windows exe
  # Same recipe as ci.yml's build-windows-exe: the nested davfs module needs
  # Go 1.25, and the WinFSP DLL loads lazily at Mount, so the exe builds
  # without WinFSP installed.
  exe:
    name: Windows exe
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Resolve dependencies
        working-directory: windows/davfs
        run: go mod tidy

      - name: Vet
        working-directory: windows/davfs
        run: go vet ./...

      - name: Build exe
        working-directory: windows/davfs
        run: go build -o otg-mount.exe ./cmd/otg-mount

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: otg-release-exe
          path: windows/davfs/otg-mount.exe
          if-no-files-found: error

  # -------------------------------------------------------------- publish
  # A tag publishes the GitHub Release; a manual dispatch only stages the
  # artifacts so the pipeline can be tested before a tag exists.
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [apk, exe]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: otg-release-apk
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: otg-release-exe
          path: dist

      - name: Checksums
        run: cd dist && sha256sum * | tee ../SHA256SUMS.txt

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "OTG Drive Bridge $GITHUB_REF_NAME" \
            --generate-notes \
            dist/* ../SHA256SUMS.txt

      - name: Upload staged artifacts (untagged runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: otg-release-staged
          path: dist
