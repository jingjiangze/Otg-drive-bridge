name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- unit tests
  # The WebDAV protocol layer, Digest auth, traversal defence, atomic writes and
  # transport selection all run on a plain JVM — no emulator needed. This is the
  # gate that must stay green.
  test:
    name: Unit tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu runner ships the Android SDK. android-actions/setup-android
      # is deliberately not used: it runs `sdkmanager tools`, and that package
      # no longer exists in the SDK repository, so the action aborts the job.
      - name: Set up Android SDK
        run: bash tools/ci-android-sdk.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
          include-hidden-files: true

  # ------------------------------------------------------------ static analysis
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        run: bash tools/ci-android-sdk.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Android lint
        run: ./gradlew :app:lintDebug --stacktrace --no-daemon
      - name: Publish lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  # ------------------------------------------------------------------- assemble
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4

      # Composite local action: pulls the latest successful openp2p AAR into
      # app/libs/ (warning-only when absent). app/build.gradle.kts enables the
      # optional source set and the files(...) dependency on the same condition.
      - name: Inject openp2p AAR
        uses: ./.github/actions/inject-openp2p-aar
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        run: bash tools/ci-android-sdk.sh
      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: otg-drive-bridge-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Record SHA-256
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          sha256sum "$APK" | tee app/build/outputs/apk/debug/SHA256SUMS.txt
          echo "APK=$APK" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------- emulator APK (x86_64 too)
  # The same debug build, but with the emulator ABI included.
  #
  # app/build.gradle.kts deliberately ships arm64-v8a only: a phone APK does not
  # need a second copy of every .so. The cost of that choice is that the CI
  # artifact cannot be installed on an x86_64 emulator — it fails with
  # INSTALL_FAILED_NO_MATCHING_ABIS rather than anything resembling a bug, and
  # the interop suite needs a real device to talk to.
  #
  # `-PincludeX86=true` adds x86_64 alongside arm64-v8a, so one artifact covers
  # both. Nothing else changes, and the artifact is a different name so the
  # phone download above is never replaced by a fatter APK.
  build-emulator:
    name: Assemble debug APK (emulator ABI)
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4

      # Composite local action: pulls the latest successful openp2p AAR into
      # app/libs/ (warning-only when absent). app/build.gradle.kts enables the
      # optional source set and the files(...) dependency on the same condition.
      - name: Inject openp2p AAR
        uses: ./.github/actions/inject-openp2p-aar
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        run: bash tools/ci-android-sdk.sh
      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble
        run: ./gradlew :app:assembleDebug -PincludeX86=true --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: otg-drive-bridge-debug-emulator
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Record SHA-256
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          sha256sum "$APK" | tee app/build/outputs/apk/debug/SHA256SUMS.txt
          echo "APK=$APK" >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------- release smoke (R8 path)
  # assembleRelease without a keystore still runs the full R8 minify + resource
  # shrink, which is a different compilation path from assembleDebug. The
  # signing itself is left to release.yml — this job exists so a proguard/R8
  # break fails CI on main instead of the release tag.
  build-release:
    name: Assemble release APK (unsigned, R8 smoke)
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4
      - name: Inject openp2p AAR
        uses: ./.github/actions/inject-openp2p-aar
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        run: bash tools/ci-android-sdk.sh
      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: otg-drive-bridge-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # ------------------------------------------------------------- go client tests
  # The Windows side of the bridge: the Digest client and the WebDAV client.
  # Both are pure Go with no cgo, so they run on a Linux runner.
  #
  # This job is the gate for the nine protocol gaps the audit named — a stale
  # re-challenge, an opaque that must be echoed, a relative Destination,
  # Overwrite, Depth, PROPPATCH, the error-body shape, ETag/If-Match and
  # 100-continue. Each one has a named test in
  # windows/internal/webdavclient/client_test.go, so a regression here is a
  # protocol regression, not a style complaint.
  #
  # The CfApi provider is *not* built here: it needs cgo and Windows headers,
  # which is the go-windows job below.
  go-client:
    name: Go client (linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # No cache-dependency-path: this module has no external dependencies
      # (stdlib only), so there is no go.sum to key a cache on. When the
      # discovery and webdav-server stages add hashicorp/mdns and x/net/webdav,
      # add `cache-dependency-path: windows/go.sum` back.
      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # `go test` is the only verification that runs on this machine for Go.
      # The rule against local builds applies to the developer's PC, not to CI.
      - name: Test
        run: go test ./... -count=1 -race

      - name: Test with coverage
        run: go test ./... -count=1 -coverprofile=coverage.out
        continue-on-error: true

      - name: Publish coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-client-coverage
          path: windows/coverage.out
          if-no-files-found: ignore

  # ------------------------------------------------------------- windows exe
  # The davfs mount layer is a *nested* module: go-winfsp needs Go 1.25 and the
  # winfsp DLL is Windows-only. Building it here — rather than raising the
  # Linux go-client job to 1.25 — keeps that job's zero-dependency, go-1.24
  # contract intact: `./...` from windows/ stops at the nested go.mod, so the
  # two modules never cross-compile on the wrong runner.
  #
  # Compiling and `go vet ./...` do NOT require WinFSP installed (the DLL is
  # loaded lazily at Mount, verified in dll_windows.go), so this job produces
  # the exe without choco. The choco install is only for a real mount test,
  # which needs a live WebDAV target and is left to the manual end-to-end pass.
  build-windows-exe:
    name: Build Windows exe
    runs-on: windows-latest
    needs: [test, lint]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      # go.sum is generated here, not committed: the developer machine has no
      # Go toolchain, and hand-writing hashes against sum.golang.org is the
      # kind of thing that silently diverges. tidy verifies every module
      # against the checksum database, which is the stronger guarantee anyway.
      - name: Resolve dependencies
        working-directory: windows/davfs
        run: go mod tidy

      - name: Verify formatting
        working-directory: windows/davfs
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: Vet
        working-directory: windows/davfs
        run: go vet ./...

      # The Windows-only files compile here for real — on Linux the build tag
      # hid them, so this is the first gate that fs.go/dir.go/cmd type-check.
      - name: Build exe
        working-directory: windows/davfs
        run: go build -o otg-mount.exe ./cmd/otg-mount

      - name: Test (linux-safe pieces)
        working-directory: windows/davfs
        run: go test ./... -count=1

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: otg-mount-windows
          path: windows/davfs/otg-mount.exe
          if-no-files-found: error

      - name: Record SHA-256
        run: |
          sha256sum windows/davfs/otg-mount.exe | tee -a "$GITHUB_STEP_SUMMARY"
