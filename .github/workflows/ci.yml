name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- unit tests
  # The WebDAV protocol layer, Digest auth, traversal defence, atomic writes and
  # transport selection all run on a plain JVM — no emulator needed. This is the
  # gate that must stay green.
  test:
    name: Unit tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu runner ships the Android SDK. android-actions/setup-android
      # is deliberately not used: it runs `sdkmanager tools`, and that package
      # no longer exists in the SDK repository, so the action aborts the job.
      - name: Set up Android SDK
        run: bash tools/ci-android-sdk.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
          include-hidden-files: true

  # ------------------------------------------------------------ static analysis
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        run: bash tools/ci-android-sdk.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Android lint
        run: ./gradlew :app:lintDebug --stacktrace --no-daemon
      - name: Publish lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  # ------------------------------------------------------------------- assemble
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        run: bash tools/ci-android-sdk.sh
      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: otg-drive-bridge-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Record SHA-256
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          sha256sum "$APK" | tee app/build/outputs/apk/debug/SHA256SUMS.txt
          echo "APK=$APK" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------- emulator APK (x86_64 too)
  # The same debug build, but with the emulator ABI included.
  #
  # app/build.gradle.kts deliberately ships arm64-v8a only: a phone APK does not
  # need a second copy of every .so. The cost of that choice is that the CI
  # artifact cannot be installed on an x86_64 emulator — it fails with
  # INSTALL_FAILED_NO_MATCHING_ABIS rather than anything resembling a bug, and
  # the interop suite needs a real device to talk to.
  #
  # `-PincludeX86=true` adds x86_64 alongside arm64-v8a, so one artifact covers
  # both. Nothing else changes, and the artifact is a different name so the
  # phone download above is never replaced by a fatter APK.
  build-emulator:
    name: Assemble debug APK (emulator ABI)
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        run: bash tools/ci-android-sdk.sh
      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble
        run: ./gradlew :app:assembleDebug -PincludeX86=true --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: otg-drive-bridge-debug-emulator
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Record SHA-256
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          sha256sum "$APK" | tee app/build/outputs/apk/debug/SHA256SUMS.txt
          echo "APK=$APK" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------- go client tests
  # The Windows side of the bridge: the Digest client and the WebDAV client.
  # Both are pure Go with no cgo, so they run on a Linux runner.
  #
  # This job is the gate for the nine protocol gaps the audit named — a stale
  # re-challenge, an opaque that must be echoed, a relative Destination,
  # Overwrite, Depth, PROPPATCH, the error-body shape, ETag/If-Match and
  # 100-continue. Each one has a named test in
  # windows/internal/webdavclient/client_test.go, so a regression here is a
  # protocol regression, not a style complaint.
  #
  # The CfApi provider is *not* built here: it needs cgo and Windows headers,
  # which is the go-windows job below.
  go-client:
    name: Go client (linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # No cache-dependency-path: this module has no external dependencies
      # (stdlib only), so there is no go.sum to key a cache on. When the
      # discovery and webdav-server stages add hashicorp/mdns and x/net/webdav,
      # add `cache-dependency-path: windows/go.sum` back.
      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # `go test` is the only verification that runs on this machine for Go.
      # The rule against local builds applies to the developer's PC, not to CI.
      - name: Test
        run: go test ./... -count=1 -race

      - name: Test with coverage
        run: go test ./... -count=1 -coverprofile=coverage.out
        continue-on-error: true

      - name: Publish coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-client-coverage
          path: windows/coverage.out
          if-no-files-found: ignore
