name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- unit tests
  # The WebDAV protocol layer, Digest auth, traversal defence, atomic writes and
  # transport selection all run on a plain JVM — no emulator needed. This is the
  # gate that must stay green.
  test:
    name: Unit tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu runner ships the Android SDK. android-actions/setup-android
      # is deliberately not used: it runs `sdkmanager tools`, and that package
      # no longer exists in the SDK repository, so the action aborts the job.
      - name: Set up Android SDK
        run: bash tools/ci-android-sdk.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
          include-hidden-files: true

  # ------------------------------------------------------------ static analysis
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        run: bash tools/ci-android-sdk.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Android lint
        run: ./gradlew :app:lintDebug --stacktrace --no-daemon
      - name: Publish lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  # ------------------------------------------------------------------- assemble
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        run: bash tools/ci-android-sdk.sh
      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: otg-drive-bridge-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Record SHA-256
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          sha256sum "$APK" | tee app/build/outputs/apk/debug/SHA256SUMS.txt
          echo "APK=$APK" >> "$GITHUB_STEP_SUMMARY"
